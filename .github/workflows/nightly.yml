# The `nightly` marker exists in pytest.ini but nothing ran it. These are the
# longer calibration and endurance checks that are too slow for every push and
# too valuable to never run.
name: nightly

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:      # so a change to the slow paths can be checked on demand

permissions:
  contents: read

jobs:
  nightly:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      # Three groups, and each one is here because CI failed without it:
      #   * rendering and Tk -- xvfb through python3-tk, for the window tests;
      #   * a C++ toolchain and Boost -- pymembus ships an sdist only, and its
      #     CMake needs Boost including the stacktrace component;
      #   * libglib2.0-0t64 -- opencv imports libgthread-2.0.so.0, and without
      #     it `import cv2` fails and conftest silently drops the render groups.
      - name: System libraries for rendering, Tk and the pymembus build
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1 libglu1-mesa libxi6 libxrandr2 libxcursor1 \
            libxinerama1 libxss1 python3-tk libglib2.0-0t64 \
            build-essential cmake ninja-build git \
            libboost-dev libboost-stacktrace-dev

      - run: python -m pip install -r requirements-dev.txt
      - run: python -m dtest.preflight
      - name: Nightly tests
        env:
          DVISION_TEST_TIMEOUT_SCALE: "3"
        run: xvfb-run -a python -m pytest tests/ -m nightly -q

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: nightly-reports
          path: reports/
          retention-days: 14
          if-no-files-found: ignore
