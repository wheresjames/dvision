# Static analysis for Python. Worth having here specifically because several
# applications launch subprocesses and open shared memory by name -- dfgb
# starts FlightGear under its own Xvfb, and the transports build IPC names
# from arguments -- which is the shape of code CodeQL is good at reading.
name: codeql

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly, so a newly published query reaches the code without a push.
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write   # required to upload the SARIF results
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          languages: python
          queries: security-and-quality

      - uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          category: "/language:python"
